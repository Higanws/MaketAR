services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maketar
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://maketar:maketar@127.0.0.1:5432/maketar
      NEXT_PUBLIC_APP_URL: http://localhost
    ports:
      - "${MAKETAR_HTTP_PORT:-80}:3000"
    volumes:
      - maketar_data:/var/lib/postgresql/data

volumes:
  maketar_data:
